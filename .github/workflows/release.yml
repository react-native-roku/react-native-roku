name: Prepare or stage npm preview
on:
  workflow_dispatch:
    inputs:
      preparation-run:
        description: Completed preparation run ID (leave blank to prepare)
        type: string
        required: false
      tarball-sha256:
        description: SHA-256 of the archive reviewed from the preparation run
        type: string
        required: false
      seal-sha256:
        description: SHA-256 of evidence/files.json recorded by preparation
        type: string
        required: false
      clipping-receipt:
        description: Compact verified physical clipping JSON for this tarball (staging only)
        type: string
        required: false
permissions:
  contents: read
jobs:
  prepare:
    if: inputs.preparation-run == ''
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Prepare the disposable runner for bounded qualification
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup
          docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 lsof zip unzip
          df -h /
      - run: pnpm install --frozen-lockfile
      - name: Qualify and seal the release archive
        id: seal
        run: |
          candidate="$PWD/.local/release-candidate"
          pnpm check --archive="$candidate/react-native-roku.tgz" --output="$candidate/evidence"
          node scripts/release.mjs --prepare > "$candidate/release-readiness.json"
          manifest_sha256="$(sha256sum "$candidate/evidence/files.json" | cut -d ' ' -f 1)"
          archive_sha256="$(sha256sum "$candidate/react-native-roku.tgz" | cut -d ' ' -f 1)"
          echo "manifest-sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "Source commit: $GITHUB_SHA"
            echo "Tarball SHA-256: $archive_sha256"
            echo "Seal SHA-256: $manifest_sha256"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ROKU_TEST_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
      - name: Show failed package lane diagnostics
        if: failure()
        run: |
          evidence=.local/release-candidate/evidence
          if [[ -d "$evidence" ]]; then
            find "$evidence" -maxdepth 1 -name 'qualify-*.mjs.log' -exec tail -n 40 {} +
          fi
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: .local/release-candidate/
          if-no-files-found: error
          include-hidden-files: true
      - name: Download the uploaded artifact by its immutable ID
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          download="$RUNNER_TEMP/release-candidate.zip"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --max-time 150 --retry-max-time 240 \
            --header "Authorization: Bearer $GH_TOKEN" --output "$download" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          echo "$ARTIFACT_SHA256  $download" | sha256sum --check
          unzip -q "$download" -d .local/rehearsal
      - name: Verify the transferred preparation artifact
        env:
          RELEASE_MANIFEST_SHA256: ${{ steps.seal.outputs.manifest-sha256 }}
        run: |
          node scripts/qualify-package.mjs --verify-only \
            --archive=.local/rehearsal/react-native-roku.tgz \
            --output=.local/rehearsal/evidence --manifest-sha256="$RELEASE_MANIFEST_SHA256"
  stage:
    if: inputs.preparation-run != ''
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Identify the reviewed preparation run
        id: reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_RUN: ${{ inputs.preparation-run }}
          RELEASE_TARBALL_SHA256: ${{ inputs.tarball-sha256 }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.seal-sha256 }}
        run: |
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$PREPARATION_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TARBALL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          repository="repos/$GITHUB_REPOSITORY"
          [[ "$(gh api "$repository" --jq .visibility)" == public ]]
          workflow_id="$(gh api "$repository/actions/workflows/release.yml" --jq .id)"
          record="$(gh api "$repository/actions/runs/$PREPARATION_RUN")"
          jq -e \
            --arg sha "$GITHUB_SHA" --argjson workflow "$workflow_id" \
            '.head_sha == $sha and .workflow_id == $workflow and .event == "workflow_dispatch" and .conclusion == "success"' <<< "$record"
          attempt="$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<< "$record")"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: node scripts/release.mjs --check
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ steps.reviewed.outputs.attempt }}
          path: .local/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation-run }}
      - name: Verify the sealed archive
        env:
          RELEASE_TARBALL_SHA256: ${{ inputs.tarball-sha256 }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.seal-sha256 }}
        run: |
          candidate=.local/candidate
          echo "$RELEASE_TARBALL_SHA256  $candidate/react-native-roku.tgz" | sha256sum --check
          node scripts/qualify-package.mjs --verify-only \
            --archive="$candidate/react-native-roku.tgz" \
            --output="$candidate/evidence" --manifest-sha256="$RELEASE_MANIFEST_SHA256"
      - name: Check the reviewed Roku clipping measurements
        env:
          CLIPPING_RECEIPT: ${{ inputs.clipping-receipt }}
          ARCHIVE_SHA256: ${{ inputs.tarball-sha256 }}
        run: printf '%s' "$CLIPPING_RECEIPT" | node benchmarks/clipping/verify.mjs --receipt "$ARCHIVE_SHA256"
      - name: Stage the exact archive for owner approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_STAGE_TOKEN }}
        run: npm stage publish .local/candidate/react-native-roku.tgz --access public --tag latest --provenance --ignore-scripts
