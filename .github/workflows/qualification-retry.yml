name: Retry macOS release qualification
on:
  push:
    branches: [preview-qualification-retry]
permissions: {}
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-run the unassigned macOS job on the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/jobs/139967346996/rerun"
