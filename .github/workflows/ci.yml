name: Package qualification
on:
  push:
    branches: [main, preview-qualification-diagnostics]
  pull_request:
  workflow_dispatch:
    inputs:
      full_qualification:
        description: Run all six lanes and verify the exact archive on macOS and Linux
        type: boolean
        default: false
      release_diagnostics:
        description: Reproduce browser startup and storage cleanup in isolation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    if: github.ref_name != 'preview-qualification-diagnostics' && !inputs.release_diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Prepare the disposable runner for bounded qualification
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          # The fast package lane does not use the preinstalled Android or Haskell SDKs.
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup
          docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 lsof zip unzip
          df -h /
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:fast
  qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.full_qualification
    needs: fast
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Prepare the disposable Linux runner for bounded qualification
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 lsof zip unzip
          df -h /
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Preserve the macOS browser bundle
        id: browser
        shell: bash
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          browser_binary="$CHROME_BINARY"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            browser_root="${browser_binary%/Contents/MacOS/*}"
            if [[ "$browser_root" != *.app ]]; then
              # The setup cache drops .app, breaking Chrome's Mach service identity.
              browser_bundle="$RUNNER_TEMP/Chrome for Testing.app"
              ditto "$browser_root" "$browser_bundle"
              browser_binary="$browser_bundle/Contents/MacOS/${browser_binary##*/}"
            fi
          fi
          echo "path=$browser_binary" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run doctor
        env:
          ROKU_TEST_CHROMIUM: ${{ steps.browser.outputs.path }}
      - run: pnpm check --archive="$PWD/.local/ci-qualification/runtime.tgz" --output="$PWD/.local/ci-qualification/evidence"
        env:
          ROKU_TEST_CHROMIUM: ${{ steps.browser.outputs.path }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.os }}
          path: .local/ci-qualification/
          if-no-files-found: warn
          include-hidden-files: true

  browser-diagnostic:
    if: github.ref_name == 'preview-qualification-diagnostics' || inputs.release_diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Compare managed and short temporary paths
        env:
          ROKU_TEST_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          probe() {
            node --input-type=module <<'JS'
          import { createServer } from "node:http";
          import { openTestBrowser } from "./scripts/browserHarness.mjs";
          const server = createServer((request, response) => response.end("qualification test"));
          await new Promise((resolve) => server.listen(0, "127.0.0.1", resolve));
          try {
            const browser = await openTestBrowser(`http://127.0.0.1:${server.address().port}/`);
            console.log(JSON.stringify(browser.version));
            await browser.close();
          } finally {
            server.close();
          }
          JS
          }
          long_tmp="$GITHUB_WORKSPACE/../.react-native-roku-qualification/workspaces/$(printf '%064d' 0)/tmp"
          mkdir -p "$long_tmp"
          TMPDIR="$(realpath "$long_tmp")" probe
          TMPDIR=/tmp probe
  storage-diagnostic:
    if: github.ref_name == 'preview-qualification-diagnostics' || inputs.release_diagnostics
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Trace the real signal, wait and synthetic cleanup failure
        shell: bash
        run: |
          python3 -VV
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path("scripts/test_qualification_storage.py")
          text = path.read_text()
          source = """            original(child)
                      raise PermissionError("synthetic secondary cleanup failure")"""
          replacement = """            real_killpg = os.killpg
                      def traced_killpg(pid, sig):
                          try:
                              result = real_killpg(pid, sig)
                          except OSError as error:
                              print("killpg", pid, sig, repr(error), flush=True)
                              raise
                          print("killpg", pid, sig, "ok", flush=True)
                          return result
                      print("child process", os.getpid(), child.pid, child.poll(), flush=True)
                      with mock.patch.object(storage.os, "killpg", side_effect=traced_killpg):
                          try:
                              original(child)
                          except BaseException as error:
                              print("real cleanup exception", repr(error), "returncode", child.poll(), flush=True)
                              raise
                      print("injecting secondary cleanup error, returncode", child.returncode, flush=True)
                      raise PermissionError("synthetic secondary cleanup failure")"""
          assert text.count(source) == 1, repr(source)
          path.write_text(text.replace(source, replacement))
          PYTHON
          set +e
          python3 scripts/test_qualification_storage.py StorageTests.test_cleanup_exception_keeps_the_primary_monitor_error
          focused=$?
          python3 scripts/qualification_storage.py run --project="$PWD" --store="$RUNNER_TEMP/diagnostic-storage" --run-limit-gib=4 -- python3 scripts/test_qualification_storage.py
          suite=$?
          echo "focused=$focused suite=$suite"
          (( focused == 0 && suite == 0 ))
